name: Package Datapack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from project metadata
        id: version
        run: |
          VERSION=$(jq -r '.project.version' project.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare datapack structure
        run: |
          mkdir -p build/datapack
          cp -r data pack.mcmeta build/datapack/

      - name: Create ZIP package
        run: |
          cd build
          zip -r "Yggdrasil-Alternative-${{ steps.version.outputs.version }}.zip" datapack

      - name: Upload datapack artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasil-Alternative-${{ steps.version.outputs.version }}
          path: build/*.zip
